name: Build and Push All Docker Images

on:
  push:
    branches: [final]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - voice-only
          - loan-only

jobs:
  build-voice:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'voice-only' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push Voice Assistant
        uses: docker/build-push-action@v5
        with:
          context: ./voice-assistant
          push: true
          tags: |
            mariabboukhelfa2025/maces:voice-assistant-${{ github.run_number }}
            mariabboukhelfa2025/maces:voice-assistant-latest

  build-loan:
    if: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == 'loan-only' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push Loan Agent
        uses: docker/build-push-action@v5
        with:
          context: ./loan-agent
          push: true
          tags: |
            mariabboukhelfa2025/maces:loan-agent-${{ github.run_number }}
            mariabboukhelfa2025/maces:loan-agent-latest