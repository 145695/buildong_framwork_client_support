<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACES - Loan Assessment</title>
<link rel="icon" type="image/png" href="maces_logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg1:#eef5ef; --bg2:#f6faf6; --bg3:#e7f1e8;
    --green:#4f9e63; --green-d:#3c7d4d; --green-dd:#1f3d2a;
    --green-soft:#e4f0e6; --green-line:#cfe3d3;
    --ink:#1f3d2a; --muted:#6b8472; --muted2:#8aa092;
    --card:rgba(255,255,255,.80); --card-solid:#ffffff;
    --shadow:0 10px 30px rgba(31,61,42,.10);
    --shadow-sm:0 4px 14px rgba(31,61,42,.08);
    --red:#c0584f;
    --radius:22px;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Plus Jakarta Sans',-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -10%,var(--bg3),transparent 60%),
      linear-gradient(160deg,var(--bg2) 0%,var(--bg1) 55%,var(--bg3) 100%);
    background-attachment:fixed;
    animation:pageIn .4s ease both;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(79,158,99,.10) 1px,transparent 1px);
    background-size:26px 26px;mask:radial-gradient(900px 500px at 50% 15%,#000,transparent 75%);}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 70px;position:relative;}

  .chips{display:flex;gap:14px;justify-content:center;margin:6px 0 26px;}
  .chip{display:flex;align-items:center;gap:11px;background:var(--card-solid);
    border-radius:40px;padding:9px 18px 9px 10px;box-shadow:var(--shadow-sm);}
  .chip .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:11px;color:#fff;object-fit:cover;}
  .chip .ic.bna{background:linear-gradient(145deg,#5aa86f,#3c7d4d);}
  .chip .ic.maces{background:#eef4ef;color:var(--green-d);border:1px solid var(--green-line);}
  .chip b{font-size:13px;letter-spacing:.3px;display:block;line-height:1.15;}
  .chip span{font-size:9.5px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;}

  .hero{text-align:center;margin:8px 0 26px;}
  .hero h1{font-family:var(--sans);font-weight:800;letter-spacing:.5px;
    font-size:34px;color:var(--green-dd);margin:0;}

  .card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);
    border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel{max-width:780px;margin:0 auto;padding:30px 32px 34px;}
  .panel h2{margin:0 0 4px;font-size:20px;color:var(--green-dd);}
  .panel .lead{margin:0 0 22px;color:var(--muted);font-size:13.5px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{font-size:12px;font-weight:600;color:var(--green-d);letter-spacing:.2px;}
  input,select{font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--green-line);border-radius:13px;padding:11px 13px;outline:none;
    transition:border .15s,box-shadow .15s;}
  input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(79,158,99,.14);}
  .hint{font-size:11px;color:var(--muted2);}
  .check{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--green-line);
    border-radius:13px;padding:11px 13px;cursor:pointer;}
  .check input{width:18px;height:18px;accent-color:var(--green);}
  .check .ct{font-size:13.5px;color:var(--ink);}
  .actions{display:flex;justify-content:center;margin-top:26px;}
  .btn{display:inline-flex;align-items:center;gap:11px;background:#fff;border:none;border-radius:40px;
    padding:15px 32px;font-family:var(--sans);font-size:15px;font-weight:700;color:var(--green-dd);
    box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .2s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(31,61,42,.16);}
  .btn .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(79,158,99,.22);}
  .btn.ghost{background:transparent;box-shadow:none;color:var(--green-d);font-weight:600;}
  .btn.ghost:hover{transform:none;text-decoration:underline;}

  #results{display:none;max-width:1140px;margin:0 auto;}
  .tabbar{display:flex;gap:8px;background:rgba(255,255,255,.7);border:1px solid var(--green-line);
    border-radius:16px;padding:6px;margin:0 auto 16px;width:max-content;box-shadow:var(--shadow-sm);}
  .tabbtn{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--muted);
    background:transparent;border:none;border-radius:11px;padding:9px 20px;cursor:pointer;transition:all .15s;}
  .tabbtn.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(79,158,99,.3);}
  .report{padding:24px 26px 26px;}
  @keyframes pageIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .anim{animation:fadeUp .45s ease both;}
  #loader{max-width:1140px;margin:0 auto;padding:80px 20px;display:flex;justify-content:center;animation:fadeUp .3s ease both;}
  .ldwrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .ldspin{width:46px;height:46px;border-radius:50%;border:4px solid var(--green-line);
    border-top-color:var(--green);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ldtxt{font-size:14px;font-weight:600;color:var(--green-d);letter-spacing:.3px;}
  #formView.fadeout{animation:fadeOut .25s ease both;}
  @keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
  #cliReport{max-width:820px;margin:0 auto;}
  .empgrid{display:grid;grid-template-columns:0.85fr 1.15fr;gap:16px 18px;align-items:start;}
  .empcol{display:flex;flex-direction:column;gap:16px;}
  .legend{font-size:11.5px;color:var(--muted);line-height:1.5;background:#fff;border:1px solid var(--green-line);border-radius:11px;padding:10px 12px;}
  .legend b{color:var(--green-dd);}
  .empgrid .sec{margin:0;}
  .empgrid .span2{grid-column:span 2;}
  .empgrid .row{padding:7px 11px;}
  .empgrid .verdict{padding:11px 13px;}
  .report .rhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
    padding:5px 10px;border-radius:20px;font-weight:600;}
  .tag.emp{background:#e9f1f6;color:#36617e;} .tag.cli{background:var(--green-soft);color:var(--green-d);}
  .report h3{margin:2px 0 14px;font-size:17px;color:var(--green-dd);}
  .sec{margin:16px 0;}
  .sec .lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);margin-bottom:9px;}
  .verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:700;}
  .verdict.ok{background:var(--green-soft);color:var(--green-d);} .verdict.no{background:#fae9e7;color:var(--red);}
  .verdict .big{font-size:15px;} .verdict small{display:block;font-weight:500;font-size:12px;opacity:.85;}
  .rows{display:flex;flex-direction:column;gap:9px;}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;
    padding:9px 12px;background:#fff;border:1px solid var(--green-line);border-radius:11px;}
  .row .k{color:var(--muted);} .row .v{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.ok{background:var(--green-soft);color:var(--green-d);} .pill.no{background:#fae9e7;color:var(--red);}
  .gauge{display:flex;align-items:center;gap:14px;}
  .gauge .track{flex:1;height:12px;border-radius:8px;background:#e7efe9;overflow:hidden;}
  .gauge .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#5aa86f,#caa23f,#c0584f);}
  .gauge .pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;}
  .zone{font-family:var(--mono);font-size:11px;letter-spacing:1px;}
  .shap{display:flex;flex-direction:column;gap:8px;}
  .sbar{display:grid;grid-template-columns:128px 1fr 54px;align-items:center;gap:10px;font-size:12px;}
  .sbar .nm{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sbar .bt{height:9px;border-radius:6px;background:#eef3ef;position:relative;}
  .sbar .bf{position:absolute;top:0;height:100%;border-radius:6px;}
  .sbar .bf.pos{background:#c0584f;left:50%;} .sbar .bf.neg{background:#4f9e63;right:50%;}
  .sbar .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .steps{display:flex;flex-direction:column;gap:10px;}
  .step{display:flex;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--green-line);border-radius:13px;font-size:13.5px;line-height:1.4;}
  .step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green-d);font-weight:700;font-size:12px;display:grid;place-items:center;}
  .note{font-size:12px;color:var(--muted);font-style:italic;margin-top:14px;line-height:1.5;}
  .illus{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted2);border:1px solid var(--green-line);border-radius:10px;padding:2px 7px;text-transform:uppercase;}
  .topbar{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto 18px;}
  .topbar .t{font-size:15px;font-weight:700;color:var(--green-dd);}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}.empgrid{grid-template-columns:1fr;}.panel{padding:24px;}}
</style>
</head>
<body>
<div class="wrap">

  <div class="chips">
    <div class="chip"><img class="ic bna" src="bna_logo.jpg"><div><b>BNA</b><span>Banque Nationale</span></div></div>
    <div class="chip"><img class="ic maces" src="maces_logo.png"><div><b>MACES</b><span>Agent IA</span></div></div>
  </div>

  <div id="formView">
    <div class="hero">
        <h1>Ready to see if you’re eligible?</h1>
        <h3> Let’s find out if we can fund you! </h3>
    </div>

    <div class="card panel">
      <h2>Loan Application</h2>
      <p class="lead">Fill the fields below and know if you are eligible for a loan at BNA</p>
      <form id="loanForm">
        <div class="grid">
          <div class="field"><label>Age</label>
            <input type="number" name="AGE" min="18" max="70" value="42" required></div>
          <div class="field"><label>Sex</label>
            <select name="SEXE"><option value="M">Male</option><option value="F">Female</option></select></div>

          <div class="field"><label>Number of dependents</label>
            <select name="DEPENDENTS">
              <option value="0">None</option>
              <option value="1">1</option>
              <option value="2" selected>2 or more</option>
            </select></div>
          <div class="field"><label>Profession</label>
            <select name="PROFESSION">
              <option value="EMPLOYE">Employee</option>
              <option value="RETRAITE">Retired</option>
              <option value="PROFESSION LIBERALE">Self-employed professional</option>
              <option value="COMMERCANT">Merchant / Trader</option>
              <option value="ARTISAN">Craftsman (artisan)</option>
              <option value="AGRICULTEUR">Farmer</option>
              <option value="ETUDIANT">Student</option>
            </select></div>

          <div class="field"><label>Job length (years)</label>
            <input type="number" name="JOB_YEARS" min="0" max="50" value="8"></div>
          <div class="field"><label>Monthly income (DZD)</label>
            <input type="number" name="INCOME" min="0" step="1000" value="200000" required></div>

          <div class="field full"><label>Credit type</label>
            <select name="TYPE_CREDIT">
              <option data-bonifie="1" data-lpp="0">Bonified — Purchase of a completed collective promotional unit</option>
              <option data-bonifie="1" data-lpp="0">Bonified — Purchase of a promotional unit (off-plan)</option>
              <option data-bonifie="1" data-lpp="0">Bonified — Construction of a rural home</option>
              <option data-bonifie="0" data-lpp="0" selected>Non-bonified — Purchase of a home from a private seller</option>
              <option data-bonifie="0" data-lpp="0">Non-bonified — Purchase of a completed new home</option>
              <option data-bonifie="0" data-lpp="0">Non-bonified — Purchase of a home (off-plan)</option>
              <option data-bonifie="0" data-lpp="0">Non-bonified — Construction of an individual home</option>
              <option data-bonifie="0" data-lpp="0">Non-bonified — Extension of an individual home</option>
              <option data-bonifie="0" data-lpp="0">Non-bonified — Home improvement</option>
              <option data-bonifie="1" data-lpp="1">LPP Bonified (3%) — Purchase of a public promotional unit (LPP)</option>
            </select></div>

          <div class="field"><label>Savings plan</label>
            <label class="check"><input type="checkbox" name="EPARGNANT">
              <span class="ct">Savings plan (sets repayment ratio to 45%)</span></label></div>
          <div class="field"><label>Loan amount (DZD)</label>
            <input type="number" name="MONTANT_CREDIT" min="100000" step="100000" value="5000000" required></div>

          <div class="field"><label>Duration (years)</label>
            <input type="number" name="DUREE_YEARS" min="1" max="30" step="1" value="20" required></div>
          <div class="field"></div>
        </div>
        <div class="actions">
          <button type="submit" class="btn">Run Assessment</button>
        </div>
      </form>
    </div>
  </div>

  <div id="loader" style="display:none">
    <div class="ldwrap">
      <div class="ldspin"></div>
      <div class="ldtxt">Evaluating your application…</div>
    </div>
  </div>

  <div id="results">
    <div class="topbar">
      <div class="t">Assessment result</div>
      <button class="btn ghost" onclick="backToForm()">← New application</button>
    </div>
    <div class="tabbar">
      <button class="tabbtn active" data-tab="cli" onclick="showTab('cli')">Client View</button>
      <button class="tabbtn" data-tab="emp" onclick="showTab('emp')">Employee View</button>
    </div>
    <div class="card report" id="cliReport"></div>
    <div class="card report" id="empReport" style="display:none"></div>
  </div>

</div>

<script>
/* Constants mirror validators.py */
const SNMG=24000, DIFFERE=6, AGE_MAX=75;
const REVENU_SUP=9*SNMG, REVENU_INF=3*SNMG;     // REVENU_MAP buckets
const INCOME_CUTOFF=6*SNMG;                      // 144,000 -> SUPERIEUR
const fmt=n=>Math.round(n).toLocaleString('en-US');
const roundDZD=(v,down=false)=>{const s=v>=1e6?1e5:(v>=1e5?1e4:1e3);return (down?Math.floor(v/s):Math.round(v/s))*s;};

/* ──────────────────────────────────────────────────────────────────────
   runAssessment(input) -> result. The rule check + interest + quotité +
   client next-steps are computed deterministically, matching validators.py.
   Model parts (eligibility confidence, risk, SHAP) are illustrative.
   To go live: POST these raw fields to your Python backend and return the
   same shape. NOTE for backend wiring: dependents come from a COUNT here
   (tier = min(count,2)); validators.engineer_features derives the tier from
   SITUATION_FAMILLE, so either send a matching SITUATION_FAMILLE or adapt
   engineer_features to accept the count. Job length is informational only —
   the model has no tenure feature (FEATURE_ORDER), so it does not affect it.
   ────────────────────────────────────────────────────────────────────── */
function runAssessment(inp){
  const age=+inp.AGE, P=+inp.MONTANT_CREDIT, dur=+inp.DUREE_CREDIT;
  const income=+inp.INCOME, deps=Math.min(parseInt(inp.DEPENDENTS)||0,2);
  const epargnant=!!inp.EPARGNANT;
  const bonifie = inp._bonifie===1 || inp._bonifie==='1';
  const lpp     = inp._lpp===1 || inp._lpp==='1';

  // income bracket flag (above / below 6×SNMG)
  const sup = income >= INCOME_CUTOFF;
  const revenu_estime = sup ? REVENU_SUP : REVENU_INF;  // model feature (bucketed)
  const bracket = sup ? 'SUPERIEUR A 6 FOIS LE SNMG' : 'INFERIEUR A 6 FOIS LE SNMG';

  // interest rate: LPP fixed 3%; other subsidized 1%/3.25%; non-subsidized 6.25%
  let taux;
  if(lpp){ taux = 3.0; }
  else if(bonifie){ taux = sup ? 3.25 : 1.0; }
  else { taux = 6.25; }

  // quotité from savings plan
  const quotite = epargnant ? 0.45 : 0.40;

  // rule check (matches compute_rule_manually: n = DUREE - DIFFERE)
  const n = dur - DIFFERE;
  const r = taux/100/12;
  const mensualite = r>0 ? P*r/(1-Math.pow(1+r,-n)) : P/n;
  const capacite   = quotite*income;   // ACTUAL income drives repayment capacity
  const age_at_end = age + dur/12;
  const capacity_ok= mensualite<=capacite;
  const age_ok     = age_at_end<=AGE_MAX;
  const eligible   = capacity_ok && age_ok;
  const failing_rule = eligible?null:(!capacity_ok?'capacity':'age');

  // illustrative model outputs (replace with backend)
  const dti=mensualite/Math.max(income,1);
  const risk=Math.min(0.97,Math.max(0.05,dti*1.0+(taux-3)*0.03+deps*0.03));
  const riskZone=risk>0.55?'ESCALATE':'REVIEW';
  const bnaProb=eligible?0.18+0.2*dti:0.55+0.3*Math.min(1,dti);
  const margin=0.5-bnaProb;
  const shap=[
    {name:'Monthly portion', val:+(0.10+0.5*dti).toFixed(3)},
    {name:'Loan amount',     val:+(0.06+0.0000004*P).toFixed(3)},
    {name:'Interest rate',   val:+(0.02+(taux-3)*0.02).toFixed(3)},
    {name:'Estimated income',val:-(0.05+revenu_estime/1e6)},
    {name:'Dependents',      val:+(0.02+deps*0.03).toFixed(3)},
  ].map(o=>({name:o.name,val:+o.val.toFixed(3)})).sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));

  // client next steps (deterministic, counterfactual-style)
  const steps=[];
  if(!eligible){
    if(failing_rule==='capacity'){
      const maxLoan = r>0 ? capacite*(1-Math.pow(1+r,-n))/r : capacite*n;
      const target=roundDZD(maxLoan);
      if(target < P*0.62){
        steps.push('Consider a smaller project or a longer duration: the current installment is well above your repayment capacity.');
      }else{
        steps.push('Consider reducing your requested loan amount to about '+fmt(target)+' DZD, which brings the monthly installment within your repayment capacity.');
      }
      steps.push('Alternatively, request a longer repayment duration to lower the monthly installment.');
    }else if(failing_rule==='age'){
      const maxN=Math.floor((AGE_MAX-age)*12);
      steps.push('Consider a shorter loan duration of at most '+maxN+' months ('+Math.floor(maxN/12)+' years), so the loan ends before age '+AGE_MAX+'.');
    }
  }

  return {
    derived:{taux,quotite,bracket,revenu_estime,income,above6:sup,deps,
             jobYears:+inp.JOB_YEARS||0,epargnant,loan:P,dur,age,
             profession:inp.PROFESSION,sexe:inp.SEXE,bonifie,lpp},
    rule:{mensualite,capacite,quotite,age_at_end,capacity_ok,age_ok,failing_rule},
    stage1:{eligible,eligibility:eligible?'ELIGIBLE':'NOT ELIGIBLE',bnaProb,margin},
    stage2:{risk,riskZone},
    shap, steps:steps.slice(0,2)
  };
}

/* decoded bracket labels, mirroring validators.decode_features */
function ageBand(a){return a<30?'< 30':a<40?'30–40':a<50?'40–50':a<60?'50–60':'> 60';}
function jobStability(p){
  const s={'EMPLOYE':3,'RETRAITE':3,'PROFESSION LIBERALE':3,'COMMERCANT':2,'ARTISAN':1,'AGRICULTEUR':1,'ETUDIANT':0}[p];
  return {3:'Employee / Retired (stable)',2:'Merchant',1:'Artisan / Farmer',0:'Student'}[s==null?1:s];
}
function depLabel(t){return t>=2?'2+':String(t);}

function empReport(R,live){
  const r=R.rule,s1=R.stage1,s2=R.stage2,d=R.derived;
  const riskPct=Math.round(s2.risk*100);
  const okPill=ok=>`<span class="pill ${ok?'ok':'no'}">${ok?'OK':'FAIL'}</span>`;
  const yrs=Math.round(d.dur/12);
  const longLoan=d.dur>240;
  const escalate=s2.riskZone==='ESCALATE';

  // Decision: prefer the backend's authoritative decision; else aggregate locally
  let decClass, decText;
  if(R.decision && R.decision.decision){
    const dd=R.decision.decision;
    decClass = (dd==='APPROVE')?'ok':'no';
    decText  = R.decision.label + ' — ' + R.decision.reason;
  } else if(!s1.eligible){ decClass='no'; decText='DECLINE — does not meet eligibility'; }
  else if(escalate){ decClass='no'; decText='ESCALATE — eligible, but high behavioral risk; refer for manual review'; }
  else { decClass='ok'; decText='APPROVE FOR REVIEW — eligible and low risk; proceed with standard documentation'; }

  const tag = live
     ? `<span class="illus" style="color:var(--green-d);border-color:var(--green-line)">live · model output</span>`
     : `<span class="illus">model output · illustrative</span>`;
  return `
   <div class="rhead"><span class="tag emp">Employee View</span>${tag}</div>
   <h3>Full Assessment Report</h3>
   <div class="empgrid">

     <div class="empcol">
       <div class="sec"><div class="lbl">Requested terms</div>
         <div class="rows">
           <div class="row"><span class="k">Loan amount</span><span class="v">${fmt(d.loan)} DZD</span></div>
           <div class="row"><span class="k">Duration</span><span class="v">${yrs} yrs (${d.dur} mo)</span></div>
           <div class="row"><span class="k">Interest rate</span><span class="v">${d.taux.toFixed(2)} %</span></div>
           <div class="row"><span class="k">Credit type</span><span class="v">${d.lpp?'LPP (3%)':d.bonifie?'Bonified':'Non-bonified'}</span></div>
         </div></div>
       <div class="sec"><div class="lbl">Applicant profile (model view)</div>
         <div class="rows">
           <div class="row"><span class="k">Sex</span><span class="v">${d.sexe==='M'?'Male':'Female'}</span></div>
           <div class="row"><span class="k">Age band</span><span class="v">${ageBand(d.age)}</span></div>
           <div class="row"><span class="k">Job stability</span><span class="v">${jobStability(d.profession)}</span></div>
           <div class="row"><span class="k">Dependents</span><span class="v">${depLabel(d.deps)}</span></div>
           <div class="row"><span class="k">Income tier</span><span class="v">${d.above6?'> 6× SNMG':'< 6× SNMG'}</span></div>
           <div class="row"><span class="k">Long loan (>20y)</span><span class="v">${longLoan?'Yes':'No'}</span></div>
           <div class="row"><span class="k">Savings plan</span><span class="v">${d.epargnant?'Yes':'No'}</span></div>
         </div></div>
       <div class="sec"><div class="lbl">Decision</div>
         <div class="verdict ${decClass}"><span class="big">${decText}</span></div></div>
     </div>

     <div class="empcol">
       <div class="sec"><div class="lbl">Stage 1 · Eligibility</div>
         <div class="verdict ${s1.eligible?'ok':'no'}"><span class="big">${s1.eligibility}</span>
           <small>conf. ${(1-s1.bnaProb).toFixed(2)} · margin ${s1.margin>=0?'+':''}${s1.margin.toFixed(2)}</small></div>
         <div class="rows" style="margin-top:9px">
           <div class="row"><span class="k">Monthly income</span><span class="v">${fmt(d.income)} DZD</span></div>
           <div class="row"><span class="k">vs 6× SNMG</span><span class="v">${d.above6?'Above':'Below'}</span></div>
           <div class="row"><span class="k">Installment</span><span class="v">${fmt(r.mensualite)} DZD/mo</span></div>
           <div class="row"><span class="k">Ceiling (${Math.round(r.quotite*100)}%)</span><span class="v">${fmt(r.capacite)} DZD/mo</span></div>
           <div class="row"><span class="k">Capacity rule</span><span class="v">${okPill(r.capacity_ok)}</span></div>
           <div class="row"><span class="k">Age at end</span><span class="v">${r.age_at_end.toFixed(1)} / ${AGE_MAX}</span></div>
           <div class="row"><span class="k">Age rule</span><span class="v">${okPill(r.age_ok)}</span></div>
         </div></div>

       <div class="sec"><div class="lbl">Stage 2 · Behavioral Risk</div>
         <div class="gauge"><div class="track"><div class="fill" style="width:${riskPct}%"></div></div><div class="pct">${riskPct}%</div></div>
         <div class="zone" style="margin-top:8px;color:${escalate?'var(--red)':'var(--green-d)'}">ZONE: ${s2.riskZone}</div>
         <div class="legend" style="margin-top:9px">
           <b>REVIEW</b> — low risk; standard loan-officer review.<br>
           <b>ESCALATE</b> — high risk or model disagreement; needs extra senior/manual attention before any decision (not the usual review).
         </div></div>

       <div class="sec"><div class="lbl">Top risk drivers (SHAP)</div><div class="shap">
         ${R.shap.map(c=>{const w=Math.min(46,Math.abs(c.val)*120),pos=c.val>=0;
           return `<div class="sbar"><span class="nm">${c.name}</span><span class="bt"><span class="bf ${pos?'pos':'neg'}" style="width:${w}%"></span></span><span class="vv" style="color:${pos?'var(--red)':'var(--green-d)'}">${pos?'+':''}${c.val.toFixed(3)}</span></div>`;}).join('')}
       </div></div>
     </div>

   </div>`;
}

function cliReport(R){
  const r=R.rule,s1=R.stage1;
  let body;
  if(s1.eligible){
    body=`<div class="verdict ok"><span class="big">Eligible</span>
      <small>${s1.margin>0.10?'Meets criteria with comfortable margin.':'Meets criteria; capacity is close to the limit.'}</small></div>
      <div class="sec"><div class="lbl">Next steps</div><div class="steps">
        <div class="step"><span class="n">1</span><span>Prepare your income and employment documentation.</span></div>
        <div class="step"><span class="n">2</span><span>Your application proceeds through standard loan officer review.</span></div>
      </div></div>`;
  }else{
    let reason='';
    if(r.failing_rule==='capacity'){reason='Your monthly installment exceeds your repayment capacity by about '+fmt(r.mensualite-r.capacite)+' DZD/month.';}
    else if(r.failing_rule==='age'){reason='Your age at the end of the credit term ('+r.age_at_end.toFixed(1)+' years) exceeds the maximum of '+AGE_MAX+'.';}
    body=`<div class="verdict no"><span class="big">Not eligible</span><small>${reason}</small></div>
      <div class="sec"><div class="lbl">What you can do</div><div class="steps">
        ${R.steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><span>${s}</span></div>`).join('')}
      </div></div>
      <div class="note">These suggestions are indicative. Contact your BNA branch for a detailed eligibility consultation. Final credit decisions are made by authorized BNA staff.</div>`;
  }
  return `<div class="rhead"><span class="tag cli">Client View</span></div>
   <h3>Application Summary</h3>
   <div class="sec"><div class="lbl">Eligibility</div>${body}</div>`;
}

const form=document.getElementById('loanForm');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(form).entries());
  data.EPARGNANT=form.EPARGNANT.checked;
  const sel=form.TYPE_CREDIT.selectedOptions[0];
  data._bonifie=sel?sel.getAttribute('data-bonifie'):'0';
  data._lpp=sel?sel.getAttribute('data-lpp'):'0';
  data.DUREE_CREDIT=String((parseInt(data.DUREE_YEARS)||0)*12);  // years -> months for backend

  let R=null, live=false;
  try{
    const resp=await fetch('/predict',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(resp.ok){ R=adaptBackend(await resp.json(), data); live=true; }
  }catch(err){ /* server not running -> local demo fallback */ }
  if(!R){ R=runAssessment(data); }

  document.getElementById('empReport').innerHTML=empReport(R,live);
  document.getElementById('cliReport').innerHTML=cliReport(R);
  showTab('cli');
  const fv=document.getElementById('formView'), rv=document.getElementById('results'),
        ld=document.getElementById('loader');
  fv.classList.add('fadeout');
  setTimeout(()=>{
    fv.style.display='none'; fv.classList.remove('fadeout');
    ld.style.display='flex';
    window.scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>{
      ld.style.display='none';
      rv.style.display='block'; rv.classList.remove('anim'); void rv.offsetWidth; rv.classList.add('anim');
    },1100);
  },230);
});

function showTab(which){
  const emp=document.getElementById('empReport'), cli=document.getElementById('cliReport');
  const show=which==='emp'?emp:cli, hide=which==='emp'?cli:emp;
  hide.style.display='none';
  show.style.display='block';
  show.classList.remove('anim'); void show.offsetWidth; show.classList.add('anim');
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===which));
}

/* Map Python predict_applicant() result onto the shape the renderers use */
function adaptBackend(res, inp){
  const rc=res.rule_check||{}, s1=res.stage1||{}, s2=res.stage2||{};
  const shap=(res.shap&&res.shap.contributions?res.shap.contributions:[])
      .slice(0,5).map(c=>({name:c.display_name||c.feature, val:+c.shap}));
  return {
    backend:true,
    derived:{taux:rc.taux,quotite:rc.quotite,income:rc.income,above6:rc.above_6snmg,
      bracket:rc.income_bracket,deps:Math.min(parseInt(inp.DEPENDENTS)||0,2),
      jobYears:+inp.JOB_YEARS||0,epargnant:!!inp.EPARGNANT,
      loan:+inp.MONTANT_CREDIT,dur:+inp.DUREE_CREDIT,age:+inp.AGE,
      profession:inp.PROFESSION,sexe:inp.SEXE,
      bonifie:(inp._bonifie==='1'||inp._bonifie===1),lpp:(inp._lpp==='1'||inp._lpp===1)},
    rule:{mensualite:rc.mensualite,capacite:rc.capacite,quotite:rc.quotite,
      age_at_end:rc.age_at_end,capacity_ok:rc.capacity_ok,age_ok:rc.age_ok,
      failing_rule:rc.failing_rule},
    stage1:{eligible:s1.eligible,eligibility:s1.eligibility,bnaProb:s1.bna_prob,
      margin:s1.bna_margin,thr:s1.bna_thr},
    stage2:{risk:s2.risk_zone? s2.risk_score:0, riskZone:s2.risk_zone},
    decision:res.decision||null,
    shap,
    steps:clientStepsFromDice(res.dice, rc, inp)
  };
}

/* mirror script.py _client_steps_from_dice for the live client view */
function clientStepsFromDice(dice, rc, inp){
  const ACT=new Set(['montant_credit','DUREE DU CREDIT','montant_par_mois']);
  const steps=[], seen=new Set();
  if(dice && dice.changes){
    for(const ch of dice.changes){
      const col=ch.feature||ch.display_name;
      if(!ACT.has(col)) continue;
      const sugg=(ch.suggestions&&ch.suggestions.length)?ch.suggestions[0]:null;
      if(sugg==null) continue;
      if(ch.pct_change!=null && ch.pct_change>0.40) continue;
      const key=(col==='montant_credit'||col==='montant_par_mois')?'loan_size':col;
      if(seen.has(key)) continue; seen.add(key);
      if(col==='montant_credit') steps.push('Consider reducing your requested loan amount to about '+fmt(roundDZD(sugg))+' DZD.');
      else if(col==='DUREE DU CREDIT') steps.push('Consider adjusting your loan duration to about '+Math.round(sugg)+' months ('+Math.floor(sugg/12)+' years).');
      else if(col==='montant_par_mois') steps.push('Consider lowering your monthly installment to about '+fmt(roundDZD(sugg,true))+' DZD.');
      if(steps.length>=2) break;
    }
  }
  if(!steps.length){
    if(rc.failing_rule==='age') steps.push('Consider a shorter loan duration so the loan ends before age '+AGE_MAX+'.');
    else if(rc.failing_rule==='capacity') steps.push('Consider reducing your loan amount; a 15-20% reduction may bring the installment within limits.');
  }
  return steps.slice(0,2);
}
function backToForm(){
  const fv=document.getElementById('formView'), rv=document.getElementById('results');
  rv.classList.add('fadeout');
  setTimeout(()=>{
    rv.style.display='none'; rv.classList.remove('fadeout','anim');
    fv.style.display='block'; fv.classList.remove('anim'); void fv.offsetWidth; fv.classList.add('anim');
    window.scrollTo({top:0,behavior:'smooth'});
  },230);
}
