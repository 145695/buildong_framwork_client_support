<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACES — Funding</title>
<link rel="icon" type="image/png" href="maces_logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{
    --bg1:#eef5ef; --bg2:#f6faf6; --bg3:#e7f1e8;
    --green:#4f9e63; --green-d:#3c7d4d; --green-dd:#1f3d2a;
    --green-soft:#e4f0e6; --green-line:#cfe3d3;
    --ink:#1f3d2a; --muted:#6b8472; --muted2:#8aa092;
    --card:rgba(255,255,255,.78); --card-solid:#ffffff;
    --shadow:0 10px 30px rgba(31,61,42,.10);
    --shadow-sm:0 4px 14px rgba(31,61,42,.08);
    --radius:22px;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Plus Jakarta Sans',-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);color:var(--ink);min-height:100vh;
    display:flex;flex-direction:column;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg3), transparent 60%),
      linear-gradient(160deg, var(--bg2) 0%, var(--bg1) 55%, var(--bg3) 100%);
    background-attachment:fixed;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(79,158,99,.10) 1px, transparent 1px);
    background-size:26px 26px;mask:radial-gradient(900px 500px at 50% 30%,#000,transparent 75%);}

  .chips{display:flex;gap:14px;justify-content:center;padding:26px 0 0;position:relative;z-index:1;}
  .chip{display:flex;align-items:center;gap:11px;background:var(--card-solid);
    border-radius:40px;padding:9px 18px 9px 10px;box-shadow:var(--shadow-sm);}
  .chip .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:11px;color:#fff;object-fit:cover;}
  .chip .ic.bna{background:linear-gradient(145deg,#5aa86f,#3c7d4d);}
  .chip .ic.maces{background:#eef4ef;color:var(--green-d);border:1px solid var(--green-line);}
  .chip b{font-size:13px;letter-spacing:.3px;display:block;line-height:1.15;}
  .chip span{font-size:9.5px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
  .card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);
    border-radius:var(--radius);box-shadow:var(--shadow);
    max-width:560px;width:100%;padding:48px 44px;text-align:center;
    animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted2);margin-bottom:18px;}
  .glyph{width:64px;height:64px;border-radius:50%;margin:0 auto 22px;
    background:radial-gradient(circle at 38% 30%, #eafff0 0%, #8fd1a1 24%, #4f9e63 62%, #2e6b41 100%);
    box-shadow:0 12px 26px rgba(47,107,65,.28), inset -6px -8px 16px rgba(20,60,33,.30), inset 5px 6px 12px rgba(255,255,255,.35);
    display:grid;place-items:center;}
  .glyph svg{width:30px;height:30px;color:#fff;}
  h1{font-size:26px;font-weight:800;color:var(--green-dd);line-height:1.3;letter-spacing:.2px;}
  .sub{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.55;}

  .actions{display:flex;gap:14px;justify-content:center;margin-top:32px;}
  .btn{font-family:var(--sans);font-size:15px;font-weight:700;border:none;cursor:pointer;
    border-radius:40px;padding:15px 40px;transition:transform .12s, box-shadow .2s, background .2s;}
  .btn.yes{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(79,158,99,.32);}
  .btn.yes:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(79,158,99,.42);}
  .btn.no{background:#fff;color:var(--green-d);box-shadow:var(--shadow-sm);}
  .btn.no:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,61,42,.14);}

  .footnote{text-align:center;font-size:12px;color:var(--muted2);padding:0 0 26px;position:relative;z-index:1;}
  @media(max-width:520px){.card{padding:38px 26px;}.actions{flex-direction:column;}.btn{width:100%;}}
</style>
</head>
<body>

  <div class="chips">
    <div class="chip"><img class="ic bna" src="bna_logo.jpg" alt="BNA"><div><b>BNA</b><span>Banque Nationale</span></div></div>
    <div class="chip"><img class="ic maces" src="maces_logo.png" alt="MACES"><div><b>MACES</b><span>Agent IA</span></div></div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="eyebrow">Loan Recommendation</div>
      <div class="glyph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 3.2c-.8.3-1.2.8-1.2 1.8"/><line x1="12" y1="17" x2="12" y2="17.5"/>
        </svg>
      </div>
      <h1>You're leaving the conversation to check your eligibility.</h1>
      <p class="sub">We'll take you to a short form to see if we can fund you, then explain the result. You can return to the chat anytime.</p>
      <div class="actions">
        <button class="btn yes" onclick="onProceed()">Proceed</button>
        <button class="btn no" onclick="onBack()">Back to Conversation</button>
      </div>
    </div>
  </div>

  <div class="footnote">Final credit decisions are made by authorized BNA staff.</div>

<script>
  function onProceed(){
    document.body.style.transition = 'opacity .35s ease';
    document.body.style.opacity = '0';
    setTimeout(()=>{ window.location.href = "__PROCEED_URL__"; }, 350);
    }
  function onBack(){ window.location.href = "__RETURN_URL__"; }
</script>
</body>
</html>
