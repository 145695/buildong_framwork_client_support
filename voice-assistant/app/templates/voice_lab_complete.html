<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACES</title>
    <link rel="icon" type="image/png" href="/static/icons/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F0F4F1;
            --accent-color: #3DAA60;
            --accent-light: #6DCFA0;
            --accent-dark: #1B6B3A;
            --text-color: #1a2e22;
            --muted-color: #5a7a65;
            --danger-color: #e05555;
            --warning-color: #ffc107;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: radial-gradient(ellipse at 60% 20%, #d8f0e4 0%, #eaf5ee 40%, #F0F4F1 100%);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mono { font-family: 'DM Mono', monospace; }

        /* ── TOP-LEFT END CALL BUTTON ── */
        .end-call-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(224, 85, 85, 0.25);
            color: var(--danger-color);
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                0 4px 24px rgba(0,0,0,0.07),
                inset 0 1px 0 rgba(255,255,255,0.8);
            transition: all 0.25s ease;
            z-index: 100;
            letter-spacing: 0.3px;
        }

        .end-call-btn:hover {
            background: rgba(224, 85, 85, 0.12);
            border-color: rgba(224, 85, 85, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(224,85,85,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .end-call-btn:active { transform: translateY(0); }

        .end-call-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger-color);
        }

        /* ── MAIN LAYOUT ── */
        .call-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            height: 100%;
            padding-bottom: 120px;
            position: relative;
            z-index: 1;
        }

        /* ── GLASS ORB ── */
        .orb-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-bottom: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Ripple rings */
        .orb-ring {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 1.5px solid rgba(61, 170, 96, 0.35);
            opacity: 0;
            pointer-events: none;
        }

        body.recording .orb-ring:nth-child(1) { animation: ringPulse 2s ease-out infinite 0s; }
        body.recording .orb-ring:nth-child(2) { animation: ringPulse 2s ease-out infinite 0.65s; }
        body.recording .orb-ring:nth-child(3) { animation: ringPulse 2s ease-out infinite 1.3s; }

        body.speaking .orb-ring:nth-child(1) { animation: ringPulseBig 1.2s ease-out infinite 0s; }
        body.speaking .orb-ring:nth-child(2) { animation: ringPulseBig 1.2s ease-out infinite 0.4s; }
        body.speaking .orb-ring:nth-child(3) { animation: ringPulseBig 1.2s ease-out infinite 0.8s; }

        @keyframes ringPulse {
            0%   { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.75); opacity: 0; }
        }
        @keyframes ringPulseBig {
            0%   { transform: scale(0.9); opacity: 0.8; border-color: rgba(109, 207, 160, 0.5); }
            100% { transform: scale(2.2);  opacity: 0; }
        }

        /* THE GLASS ORB */
        .orb {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
            z-index: 10;
            transition: filter 0.5s ease;

            /* Glass layers — order matters */
            background:
                /* specular rim */
                radial-gradient(ellipse 60% 25% at 68% 78%, rgba(255,255,255,0.18) 0%, transparent 70%),
                /* main body glass tint */
                radial-gradient(ellipse 90% 90% at 40% 38%,
                    rgba(120, 230, 160, 0.82) 0%,
                    rgba(60, 180, 100, 0.75) 30%,
                    rgba(20, 110, 55, 0.88) 65%,
                    rgba(10, 60, 30, 0.92) 100%
                );

            box-shadow:
                /* outer glow */
                0 0 60px rgba(61, 170, 96, 0.28),
                0 16px 48px rgba(0,0,0,0.14),
                /* inner top-left highlight */
                inset 4px 6px 18px rgba(255,255,255,0.55),
                /* inner bottom-right shadow */
                inset -6px -8px 24px rgba(0, 40, 15, 0.35),
                /* rim light */
                inset 0 0 0 1px rgba(255,255,255,0.2);

            animation: blobIdle 6s ease-in-out infinite, floatOrb 5s ease-in-out infinite;
        }

        /* Primary specular highlight — the "glass lens" look */
        .orb::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 14%;
            width: 42%;
            height: 28%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.1) 60%, transparent 100%);
            border-radius: 50%;
            transform: rotate(-20deg);
            pointer-events: none;
            z-index: 11;
        }

        /* Secondary caustic shimmer */
        .orb::after {
            content: '';
            position: absolute;
            bottom: 18%;
            right: 16%;
            width: 22%;
            height: 12%;
            background: radial-gradient(ellipse, rgba(180,255,210,0.5) 0%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 11;
            animation: caustic 3s ease-in-out infinite alternate;
        }

        @keyframes caustic {
            0%   { opacity: 0.4; transform: scale(1) rotate(0deg); }
            100% { opacity: 0.9; transform: scale(1.3) rotate(15deg); }
        }

        /* Blob shape morphing — the flowy thing */
        @keyframes blobIdle {
            0%   { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; }
            16%  { border-radius: 42% 58% 34% 66% / 60% 34% 66% 40%; }
            33%  { border-radius: 55% 45% 62% 38% / 42% 58% 42% 58%; }
            50%  { border-radius: 35% 65% 68% 32% / 38% 32% 68% 62%; }
            66%  { border-radius: 70% 30% 38% 62% / 65% 70% 30% 35%; }
            83%  { border-radius: 48% 52% 44% 56% / 56% 44% 56% 44%; }
            100% { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; }
        }

        @keyframes floatOrb {
            0%, 100% { transform: translateY(0px) scale(1); }
            50%       { transform: translateY(-12px) scale(1.02); }
        }

        /* RECORDING state */
        body.recording .orb {
            background:
                radial-gradient(ellipse 60% 25% at 68% 78%, rgba(255,255,255,0.22) 0%, transparent 70%),
                radial-gradient(ellipse 90% 90% at 40% 38%,
                    rgba(160, 255, 190, 0.88) 0%,
                    rgba(80, 210, 120, 0.80) 30%,
                    rgba(30, 140, 70, 0.90) 65%,
                    rgba(10, 70, 35, 0.94) 100%
                );
            box-shadow:
                0 0 80px rgba(61, 200, 100, 0.4),
                0 16px 48px rgba(0,0,0,0.14),
                inset 4px 6px 18px rgba(255,255,255,0.65),
                inset -6px -8px 24px rgba(0, 40, 15, 0.3),
                inset 0 0 0 1px rgba(255,255,255,0.25);
            animation: blobRecord 3s ease-in-out infinite, floatOrbRecord 2.5s ease-in-out infinite;
        }

        @keyframes blobRecord {
            0%   { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; transform: scale(1.02); }
            25%  { border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%; transform: scale(1.06); }
            50%  { border-radius: 55% 45% 65% 35% / 45% 60% 40% 55%; transform: scale(1.04); }
            75%  { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: scale(1.07); }
            100% { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; transform: scale(1.02); }
        }

        @keyframes floatOrbRecord {
            0%, 100% { transform: translateY(-4px); }
            50%       { transform: translateY(-16px); }
        }

        /* SPEAKING state */
        body.speaking .orb {
            background:
                radial-gradient(ellipse 60% 25% at 68% 78%, rgba(255,255,255,0.28) 0%, transparent 70%),
                radial-gradient(ellipse 90% 90% at 40% 38%,
                    rgba(200, 255, 220, 0.92) 0%,
                    rgba(100, 230, 140, 0.85) 25%,
                    rgba(40, 170, 85, 0.90) 60%,
                    rgba(15, 80, 40, 0.95) 100%
                );
            box-shadow:
                0 0 100px rgba(61, 220, 110, 0.55),
                0 16px 60px rgba(0,0,0,0.12),
                inset 4px 6px 20px rgba(255,255,255,0.75),
                inset -6px -8px 28px rgba(0, 40, 15, 0.25),
                inset 0 0 0 1.5px rgba(255,255,255,0.35);
            animation: blobSpeak 1.8s ease-in-out infinite, floatOrbSpeak 1.4s ease-in-out infinite;
        }

        @keyframes blobSpeak {
            0%   { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; transform: scale(1.04); }
            20%  { border-radius: 38% 62% 32% 68% / 62% 32% 68% 38%; transform: scale(1.10); }
            40%  { border-radius: 58% 42% 66% 34% / 40% 62% 38% 60%; transform: scale(1.07); }
            60%  { border-radius: 32% 68% 72% 28% / 32% 28% 72% 68%; transform: scale(1.12); }
            80%  { border-radius: 72% 28% 36% 64% / 68% 72% 28% 32%; transform: scale(1.08); }
            100% { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; transform: scale(1.04); }
        }

        @keyframes floatOrbSpeak {
            0%, 100% { transform: translateY(-6px); }
            50%       { transform: translateY(-18px); }
        }

        /* WAITING (followup) */
        .orb-container.waiting .orb {
            background:
                radial-gradient(ellipse 60% 25% at 68% 78%, rgba(255,255,255,0.2) 0%, transparent 70%),
                radial-gradient(ellipse 90% 90% at 40% 38%,
                    rgba(255, 230, 100, 0.88) 0%,
                    rgba(255, 160, 30, 0.82) 45%,
                    rgba(180, 80, 0, 0.92) 100%
                );
            box-shadow:
                0 0 70px rgba(255, 193, 7, 0.38),
                0 16px 48px rgba(0,0,0,0.14),
                inset 4px 6px 18px rgba(255,255,255,0.5),
                inset -6px -8px 24px rgba(80, 30, 0, 0.3),
                inset 0 0 0 1px rgba(255,255,255,0.2);
            animation: blobIdle 4s ease-in-out infinite;
        }

        /* ── WAVEFORM ── */
        .waves {
            display: flex;
            gap: 6px;
            height: 80px;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            transition: opacity 0.4s ease;
        }

        .wave-bar {
            width: 7px;
            background: linear-gradient(to top, #2E7D32, #66BB6A);
            border-radius: 10px;
            height: 8px;
            transition: height 0.1s ease;
        }

        body:not(.recording):not(.speaking) .wave-bar {
            animation: waveIdle 2.5s ease-in-out infinite alternate;
        }
        body:not(.recording):not(.speaking) .wave-bar:nth-child(odd)  { animation-delay: 0.3s; }
        body:not(.recording):not(.speaking) .wave-bar:nth-child(even) { animation-delay: 0.8s; }
        @keyframes waveIdle { 0% { height: 5px; } 100% { height: 14px; } }

        body.recording .wave-bar { animation: waveActive 0.55s ease-in-out infinite alternate; }
        body.recording .wave-bar:nth-child(1)  { animation-delay: 0.00s; animation-duration: 0.50s; }
        body.recording .wave-bar:nth-child(2)  { animation-delay: 0.07s; animation-duration: 0.44s; }
        body.recording .wave-bar:nth-child(3)  { animation-delay: 0.13s; animation-duration: 0.60s; }
        body.recording .wave-bar:nth-child(4)  { animation-delay: 0.04s; animation-duration: 0.42s; }
        body.recording .wave-bar:nth-child(5)  { animation-delay: 0.19s; animation-duration: 0.56s; }
        body.recording .wave-bar:nth-child(6)  { animation-delay: 0.02s; animation-duration: 0.48s; }
        body.recording .wave-bar:nth-child(7)  { animation-delay: 0.17s; animation-duration: 0.63s; }
        body.recording .wave-bar:nth-child(8)  { animation-delay: 0.09s; animation-duration: 0.40s; }
        body.recording .wave-bar:nth-child(9)  { animation-delay: 0.24s; animation-duration: 0.54s; }
        body.recording .wave-bar:nth-child(10) { animation-delay: 0.05s; animation-duration: 0.46s; }
        body.recording .wave-bar:nth-child(11) { animation-delay: 0.15s; animation-duration: 0.58s; }
        @keyframes waveActive { 0% { height: 8px; } 100% { height: 66px; } }

        body.speaking .wave-bar {
            background: linear-gradient(to top, #1B5E20, #A5D6A7);
            animation: waveSpeak 0.32s ease-in-out infinite alternate;
        }
        body.speaking .wave-bar:nth-child(1)  { animation-delay: 0.00s; animation-duration: 0.28s; }
        body.speaking .wave-bar:nth-child(2)  { animation-delay: 0.04s; animation-duration: 0.26s; }
        body.speaking .wave-bar:nth-child(3)  { animation-delay: 0.09s; animation-duration: 0.36s; }
        body.speaking .wave-bar:nth-child(4)  { animation-delay: 0.03s; animation-duration: 0.24s; }
        body.speaking .wave-bar:nth-child(5)  { animation-delay: 0.14s; animation-duration: 0.32s; }
        body.speaking .wave-bar:nth-child(6)  { animation-delay: 0.01s; animation-duration: 0.30s; }
        body.speaking .wave-bar:nth-child(7)  { animation-delay: 0.11s; animation-duration: 0.38s; }
        body.speaking .wave-bar:nth-child(8)  { animation-delay: 0.06s; animation-duration: 0.23s; }
        body.speaking .wave-bar:nth-child(9)  { animation-delay: 0.17s; animation-duration: 0.31s; }
        body.speaking .wave-bar:nth-child(10) { animation-delay: 0.04s; animation-duration: 0.27s; }
        body.speaking .wave-bar:nth-child(11) { animation-delay: 0.10s; animation-duration: 0.35s; }
        @keyframes waveSpeak { 0% { height: 10px; } 100% { height: 72px; } }

        /* ── GLASSY RECORD BUTTON ── */
        .record-btn {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 40px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.52);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            color: var(--text-color);
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.10),
                0 2px 8px rgba(0,0,0,0.06),
                inset 0 1px 0 rgba(255,255,255,0.9),
                inset 0 -1px 0 rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .record-btn:hover {
            transform: translateX(-50%) translateY(-2px) scale(1.02);
            box-shadow:
                0 12px 40px rgba(0,0,0,0.13),
                0 4px 12px rgba(0,0,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.95),
                inset 0 -1px 0 rgba(0,0,0,0.04);
        }

        .record-btn:active {
            transform: translateX(-50%) scale(0.97);
        }

        /* Recording state — glassy green tint */
        body.recording .record-btn {
            background: rgba(61, 170, 96, 0.22);
            border-color: rgba(61, 170, 96, 0.45);
            color: var(--accent-dark);
            box-shadow:
                0 8px 32px rgba(61, 170, 96, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.8),
                inset 0 -1px 0 rgba(0, 60, 20, 0.08);
        }

        .record-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted-color);
            transition: background 0.3s, box-shadow 0.3s;
            flex-shrink: 0;
        }

        body.recording .record-icon {
            background: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(61, 170, 96, 0.25);
            animation: iconBlink 1s ease-in-out infinite;
        }

        @keyframes iconBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        /* ── PARTICLES ── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(61, 170, 96, 0.25);
            animation: floatP var(--dur) linear var(--delay) infinite;
        }

        @keyframes floatP {
            0%   { transform: translateY(105vh) scale(0); opacity: 0; }
            8%   { opacity: 1; }
            92%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* ── HIDDEN COMPAT ELEMENTS ── */
        #voiceOutputSection { display: none !important; visibility: hidden !important; }
        #resultsSection     { display: none !important; visibility: hidden !important; }
        .agent-label        { display: none !important; }
        #mic-status         { display: none !important; }
        #call-timer         { display: none !important; }
        #audioContainer     { position: absolute; width: 0; height: 0; opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <!-- TOP-LEFT END CALL -->
    <button class="end-call-btn" onclick="endCall()">
        <div class="end-call-dot"></div>
        End call
    </button>

    <div class="call-screen">

        <!-- ORB -->
        <div class="orb-container" id="mic-button"
             onmousedown="startRecording()"
             onmouseup="stopRecording()"
             onmouseleave="stopRecording()"
             ontouchstart="startRecording()"
             ontouchend="stopRecording()">
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            <div class="orb"></div>
        </div>

        <!-- WAVEFORM -->
        <div class="waves" id="waves">
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <!-- Hidden compat elements -->
        <div id="mic-status" class="mono" style="display:none;"></div>
        <div id="call-timer" class="mono" style="display:none;"></div>

        <div id="voiceOutputSection" style="display:none;">
            <div id="localizedResponse"></div>
            <div id="audioContainer" style="display:none;">
                <audio id="audioPlayer" controls autoplay>
                    <source id="audioSource" type="audio/wav">
                </audio>
                <div style="display:none;">
                    <span id="detectedLang"></span>
                    <span id="audioModel"></span>
                    <span id="sampleRate"></span>
                    <a id="downloadLink"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM GLASS RECORD BUTTON -->
    <button class="record-btn" id="record-btn"
            onmousedown="startRecording()"
            onmouseup="stopRecording()"
            onmouseleave="stopRecording()"
            ontouchstart="startRecording()"
            ontouchend="stopRecording()">
        <div class="record-icon"></div>
        <span id="record-label">Hold to speak</span>
    </button>

    <!-- Hidden results section (compat) -->
    <div id="resultsSection" style="display:none;">
        <div id="statusBadge"></div>
        <div id="progressFill"></div>
        <div id="progressText"></div>
        <div id="summaryGrid"></div>
        <div id="stagesContainer"></div>
    </div>
    <input type="file" id="audioInput" style="display:none;">

    <script>
        // ── PARTICLES ──────────────────────────────────────────────────
        (function() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 22; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 3 + Math.random() * 5;
                p.style.cssText = `
                    left:${Math.random()*100}%;
                    width:${size}px; height:${size}px;
                    --dur:${10 + Math.random()*12}s;
                    --delay:${Math.random()*12}s;
                `;
                c.appendChild(p);
            }
        })();

        // ── STATUS HELPER (silent — multilingual UI) ──────────────────
        function setStatus(text) { /* intentionally empty */ }

        // ── INJECTED PROXIES & LOGIC ───────────────────────────────────
        const MINIMAL_CALL_UI = true;
        window.isFollowupMode = false;
        window.followupRetries = 0;
        window.lastDetectedLanguage = 'en';
        window.followupTimeout = null;

        const OriginalWebSocket = window.WebSocket;
        const originalSend = OriginalWebSocket.prototype.send;
        OriginalWebSocket.prototype.send = function(data) {
            if (window.isFollowupMode && !this._followupSent) {
                originalSend.call(this, JSON.stringify({type: 'set_is_followup', value: true}));
                this._followupSent = true;
            }
            originalSend.call(this, data);
        };

        // ── WEBSOCKET AUDIO STREAMING ──────────────────────────────────
        let ws = null;
        let audioContext = null;
        let processor = null;
        let mediaStream = null;
        let isRecording = false;
        let sessionId = null;

        async function startRecording() {
            if (isRecording) return;
            if (!sessionId) {
                console.error('[Session] No session_id available');
                setStatus('Session non initialisée');
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 16000 }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                processor = audioContext.createScriptProcessor(512, 1, 1);
                const source = audioContext.createMediaStreamSource(mediaStream);
                source.connect(processor);
                processor.connect(audioContext.destination);

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/audio/${sessionId}`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    console.log('[WebSocket] Connected');
                    setStatus('Écoute en cours…');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'status') {
                            console.log('[WebSocket] Status:', data.state);
                        } else if (data.type === 'status_update') {
                            setStatus(data.message);
                        } else if (data.type === 'status_audio') {
                            if (data.audio) playAudio(data.audio);
                        } else if (data.type === 'transcript') {
                            setStatus('Transcription…');
                        } else if (data.type === 'response_text') {
                            setStatus('Réponse reçue');
                        } else if (data.type === 'pipeline_result') {
                            console.log('[WebSocket] Pipeline Result:', data.data);
                            console.log('[WebSocket] end_call:', data.data.end_call);
                            console.log('[WebSocket] redirect_url:', data.data.redirect_url);
                            setStatus('Prêt à écouter');
                            if (data.data.final_response_audio) {
                                // Check if call should end and redirect after audio finishes
                                if (data.data.end_call && data.data.redirect_url) {
                                    console.log('[WebSocket] End call flag detected, will redirect after audio');
                                    playAudioWithRedirect(`data:audio/wav;base64,${data.data.final_response_audio}`, data.data.redirect_url);
                                } else {
                                    playAudio(`data:audio/wav;base64,${data.data.final_response_audio}`);
                                }
                            } else {
                                // No audio, redirect immediately if end_call flag is set
                                if (data.data.end_call && data.data.redirect_url) {
                                    console.log('[WebSocket] No audio, redirecting immediately');
                                    window.location.href = data.data.redirect_url;
                                }
                            }
                            if (MINIMAL_CALL_UI) return;
                            const rs = document.getElementById('resultsSection');
                            if (rs) {
                                rs.style.display = 'block';
                                updateStatus('success', 'Analysis Complete');
                                try { displayResults(data.data); displayVoiceOutput(data.data); } catch(e) { console.error(e); }
                            }
                        } else if (data.type === 'error') {
                            console.error('[WebSocket] Error:', data.message);
                            setStatus('Erreur');
                        }
                    } catch (e) { console.error('[WebSocket] JSON parse error:', e); }
                };

                ws.onerror = () => setStatus('Erreur de connexion');
                ws.onclose = () => {};

                processor.onaudioprocess = (event) => {
                    if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
                    const inputData = event.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    ws.send(pcm16.buffer);
                };

                isRecording = true;
                document.body.classList.add('recording');
                document.body.classList.remove('speaking');

                const recordLabel = document.getElementById('record-label');
                if (recordLabel) recordLabel.textContent = 'Release to send';

                console.log('[Audio] Recording started');

            } catch (error) {
                console.error('[Audio] Microphone access error:', error);
                setStatus('Accès micro refusé');
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            document.body.classList.remove('recording');

            const recordLabel = document.getElementById('record-label');
            if (recordLabel) recordLabel.textContent = 'Hold to speak';

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type: 'end_of_speech'}));
                setStatus('Traitement…');
            }
            if (processor) processor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        }

        function updateMicStatus(message, color) {
            const el = document.getElementById('mic-status');
            if (el) { el.textContent = message; el.style.color = color; }
        }

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        });

        function playAudio(audioDataUrl) {
            try {
                document.body.classList.add('speaking');
                setStatus('Réponse en cours…');
                const audio = new Audio(audioDataUrl);
                audio.volume = 1.0;
                audio.addEventListener('ended', () => {
                    document.body.classList.remove('speaking');
                    setStatus('Prêt à écouter');
                });
                audio.play().catch(e => {
                    console.error('Error playing audio:', e);
                    document.body.classList.remove('speaking');
                });
            } catch(e) {
                console.error('Error creating audio element:', e);
                document.body.classList.remove('speaking');
            }
        }

        function playAudioWithRedirect(audioDataUrl, redirectUrl) {
            try {
                document.body.classList.add('speaking');
                setStatus('Réponse en cours…');
                const audio = new Audio(audioDataUrl);
                audio.volume = 1.0;
                audio.addEventListener('ended', () => {
                    document.body.classList.remove('speaking');
                    console.log('[Audio] Finished, redirecting to:', redirectUrl);
                    window.location.href = redirectUrl;
                });
                audio.play().catch(e => {
                    console.error('Error playing audio:', e);
                    document.body.classList.remove('speaking');
                    // Redirect even if audio fails
                    console.log('[Audio] Error, redirecting anyway to:', redirectUrl);
                    window.location.href = redirectUrl;
                });
            } catch(e) {
                console.error('Error creating audio element:', e);
                document.body.classList.remove('speaking');
                // Redirect even if audio fails
                console.log('[Audio] Error, redirecting anyway to:', redirectUrl);
                window.location.href = redirectUrl;
            }
        }

        // ── COMPAT REFS ────────────────────────────────────────────────
        const audioInput      = document.getElementById('audioInput');
        const resultsSection  = document.getElementById('resultsSection');
        const statusBadge     = document.getElementById('statusBadge');
        const progressFill    = document.getElementById('progressFill');
        const progressText    = document.getElementById('progressText');
        const summaryGrid     = document.getElementById('summaryGrid');
        const stagesContainer = document.getElementById('stagesContainer');

        // ── SESSION MANAGEMENT ─────────────────────────────────────────
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlSessionId = urlParams.get('session_id');
            if (urlSessionId) {
                sessionId = urlSessionId;
            } else {
                try {
                    const response = await fetch('/session/create', { method: 'POST' });
                    if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) return;
                    const data = await response.json();
                    sessionId = data.session_id;
                } catch (error) { console.error('[Session] Failed to create session:', error); }
            }
        });

        async function endCall() {
            if (sessionId) {
                try { await fetch(`/session/${sessionId}`, { method: 'DELETE' }); } catch(e) {}
            }
            window.location.href = '/';
        }

        async function processFullPipeline() {
            if (!audioInput.files.length) return;
            resultsSection.style.display = 'block';
            updateStatus('processing', 'Processing...');
            updateProgress(20, 'Analyzing audio...');
            const formData = new FormData();
            formData.append('audio', audioInput.files[0]);
            if (sessionId) formData.append('session_id', sessionId);
            try {
                const response = await fetch('/test/voice-full-pipeline', { method: 'POST', body: formData });
                if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) { updateStatus('error', 'Invalid Response'); return; }
                const data = await response.json();
                updateProgress(100, 'Analysis complete!');
                if (response.ok) { updateStatus('success', 'Analysis Complete'); displayResults(data); displayVoiceOutput(data); }
                else { updateStatus('error', 'Analysis Failed'); }
            } catch (error) { updateStatus('error', 'Network Error'); }
        }

        function updateStatus(type, text) {
            if (!statusBadge) return;
            statusBadge.textContent = text;
        }
        function updateProgress(percent, text) {
            if (progressFill) progressFill.style.width = percent + '%';
            if (progressText) progressText.textContent = text;
        }
        function displayResults(data) {
            const summary = data.summary || { successful_stages: 0, total_stages: 0 };
            const successRate = summary.total_stages > 0 ? Math.round((summary.successful_stages / summary.total_stages) * 100) : 0;
            if (summaryGrid) summaryGrid.innerHTML = `<div>${successRate}% success</div>`;
        }
        function displayVoiceOutput(data) { if (MINIMAL_CALL_UI) return; }
        function createStageCard(title, stage, content) { return `<div>${title}: ${content}</div>`; }
        function displayError(message) { if (stagesContainer) stagesContainer.innerHTML = `<div>Error: ${message}</div>`; }

        const originalDisplayResults = displayResults;
        displayResults = function(data) {
            if (data.action === 'redirect') {
                window.location.href = '/loan-eligibility-form?session_id=' + sessionId + '&lang=' + window.lastDetectedLanguage;
                return;
            }
            if (data.action === 'continue') { dismissFollowup(); return; }
            if (data.action === 'retry') {
                window.followupRetries++;
                if (window.followupRetries > 2) { dismissFollowup(); }
                else {
                    document.getElementById('mic-button').classList.add('waiting');
                    setStatus("Je n'ai pas compris, Oui ou Non ?");
                    resetFollowupTimeout();
                }
                return;
            }
            originalDisplayResults(data);
            if (data.loan_followup_triggered) {
                window.isFollowupMode = true;
                window.followupRetries = 0;
                window.lastDetectedLanguage = data.stages?.whisper_stt?.detected_language || 'en';
                document.getElementById('mic-button').classList.add('waiting');
                setStatus('Oui ou Non ?');
                resetFollowupTimeout();
            }
        };

        function dismissFollowup() {
            window.isFollowupMode = false;
            window.followupRetries = 0;
            clearTimeout(window.followupTimeout);
            document.getElementById('mic-button').classList.remove('waiting');
            setStatus('Prêt à écouter');
        }

        function resetFollowupTimeout() {
            clearTimeout(window.followupTimeout);
            window.followupTimeout = setTimeout(dismissFollowup, 15000);
        }

        // Timer (compat)
        (function() {
            let callInterval, callSeconds = 0;
            const timerEl  = document.getElementById('call-timer');
            const orbBtn   = document.getElementById('mic-button');
            const voSection = document.getElementById('voiceOutputSection');
            const locResp  = document.getElementById('localizedResponse');
            function fmt(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
            function startT() {
                callSeconds = 0;
                if (timerEl) timerEl.textContent = '00:00';
                clearInterval(callInterval);
                callInterval = setInterval(() => { callSeconds++; if(timerEl) timerEl.textContent = fmt(callSeconds); }, 1000);
            }
            function stopT() { clearInterval(callInterval); }
            orbBtn.addEventListener('mousedown', startT);
            orbBtn.addEventListener('touchstart', startT);
            orbBtn.addEventListener('mouseup', stopT);
            orbBtn.addEventListener('mouseleave', stopT);
            orbBtn.addEventListener('touchend', stopT);
        })();
    </script>
</body>
</html>
